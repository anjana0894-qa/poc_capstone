name: Playwright Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        env:
          SMARTERP_USERNAME: ${{ secrets.SMARTERP_USERNAME }}
          SMARTERP_PASSWORD: ${{ secrets.SMARTERP_PASSWORD }}
        run: npx playwright test

      - name: Checkout qa-dashboard branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: qa-dashboard
          path: qa-dashboard

      - name: Copy Playwright report
        if: always()
        run: |
          rm -rf qa-dashboard/docs
          mkdir -p qa-dashboard/docs

          cp -r playwright-report/. qa-dashboard/docs/

      - name: Commit and push Playwright report
        if: always()
        working-directory: qa-dashboard
        run: |
          git config user.name "QA Reports Publisher"
          git config user.email "qa-reports-publisher@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Publish Playwright test report"
            git push origin HEAD:qa-dashboard
          fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
