name: Playwright Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the main project
      - name: Checkout main branch
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. Run ALL Playwright tests
      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        env:
          SMARTERP_USERNAME: ${{ secrets.SMARTERP_USERNAME }}
          SMARTERP_PASSWORD: ${{ secrets.SMARTERP_PASSWORD }}
        run: npx playwright test

      # 6. Generate dashboard data
      - name: Generate dashboard data
        if: always()
        run: node dashboard/generateDashboard.js

      # 7. Generate individual module reports
      - name: Generate module reports
        if: always()
        run: node dashboard/generateModuleReports.js

      # 8. Checkout qa-dashboard branch
      - name: Checkout qa-dashboard branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: qa-dashboard
          path: qa-dashboard

      # 9. Prepare GitHub Pages folder
      - name: Prepare dashboard
        if: always()
        run: |
          rm -rf qa-dashboard/docs
          mkdir -p qa-dashboard/docs

          cp dashboard/index.html qa-dashboard/docs/
          cp dashboard/dashboard.js qa-dashboard/docs/
          cp dashboard/styles.css qa-dashboard/docs/
          cp dashboard/dashboard-data.json qa-dashboard/docs/

          mkdir -p qa-dashboard/docs/reports
          cp -r dashboard/reports/. qa-dashboard/docs/reports/

      # 10. Commit dashboard to qa-dashboard
      - name: Publish QA Dashboard
        if: always()
        working-directory: qa-dashboard
        run: |
          git config user.name "QA Dashboard Publisher"
          git config user.email "qa-dashboard-publisher@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit"
          else
            git commit -m "Update QA automation dashboard"
            git push origin HEAD:qa-dashboard
          fi

      # 11. Upload report as GitHub Actions artifact
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # 12. Fail workflow if tests failed
      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1