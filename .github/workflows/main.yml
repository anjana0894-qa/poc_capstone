name: Playwright Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npx playwright test

      - name: Publish Playwright report
        if: always()
        run: |

          git fetch origin qa-dashboard

          git worktree add qa-dashboard origin/qa-dashboard

          rm -rf qa-dashboard/reports/playwright

          mkdir -p qa-dashboard/reports/playwright

          cp -r playwright-report/. qa-dashboard/reports/playwright/

          cd qa-dashboard

          git config user.name "QA Reports Publisher"
          git config user.email "qa-reports-publisher@users.noreply.github.com"

          git add reports/playwright

          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Publish Playwright test report"
            git push origin HEAD:qa-dashboard
          fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
