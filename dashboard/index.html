<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QA Automation Dashboard</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>QA Automation Dashboard</h1>
            <p>Playwright Test Execution</p>
            <p id="lastRun"></p>
        </header>


        <!-- Summary Cards -->

        <section class="summary">

            <div class="card">
                <h3>Total Modules</h3>
                <div id="totalModules">0</div>
            </div>

            <div class="card">
                <h3>Passed</h3>
                <div id="passedModules">0</div>
            </div>

            <div class="card">
                <h3>Failed</h3>
                <div id="failedModules">0</div>
            </div>

        </section>


        <!-- Module Details -->

        <section class="modules">

            <h2>Module Details</h2>

            <table>

                <thead>
                    <tr>
                        <th>Module</th>
                        <th>Spec File</th>
                        <th>Passed</th>
                        <th>Failed</th>
                        <th>Status</th>
                        <th>Report</th>
                    </tr>
                </thead>

                <tbody id="moduleTable">
                </tbody>

            </table>

        </section>

    </div>


    <script src="dashboard.js"></script>

</body>
</html>
